<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Nuskha — AI clinical interview system">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050c14"/>
      <stop offset="0.55" stop-color="#0a1c2e"/>
      <stop offset="1" stop-color="#122a3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#12304a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>

  <g transform="translate(1000 158)" fill="none" stroke="url(#accent)" stroke-width="2">
    <path d="M-70 -70 H58 V96 H-70 Z" fill="#0a1c2e" rx="8"/>
    <path d="M-40 -46 H28 M-40 -18 H28 M-40 10 H6" stroke="#2dd4bf" opacity="0.85"/>
    <path d="M8 52 L24 68 L54 32" stroke="#a5b4fc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M58 -70 L96 -96" stroke="#818cf8"/>
  </g>

  <g stroke="#16405c" stroke-width="1.3">
    <path d="M700 254 L800 212 L896 242 L996 300"/>
    <path d="M800 212 L846 122"/>
  </g>
  <g fill="#081826" stroke="url(#accent)" stroke-width="1.8">
    <circle cx="700" cy="254" r="6"/>
    <circle cx="800" cy="212" r="8"/>
    <circle cx="896" cy="242" r="6"/>
    <circle cx="996" cy="300" r="5"/>
    <circle cx="846" cy="122" r="5"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="132" fill="#5eead4" font-size="17" letter-spacing="6" font-weight="600">AI CLINICAL INTERVIEW</text>
    <text x="70" y="206" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="-1">Nuskha</text>
    <text x="73" y="247" fill="#c2d6e6" font-size="21">A clinical interview that documents itself.</text>
    <text x="73" y="281" fill="#6f93ad" font-size="15" letter-spacing="1.5">BILINGUAL  ·  MULTI-AGENT  ·  SOAP  ·  TRIAGE  ·  FHIR</text>
  </g>
  <rect x="0" y="316" width="1280" height="4" fill="url(#accent)"/>
</svg>
